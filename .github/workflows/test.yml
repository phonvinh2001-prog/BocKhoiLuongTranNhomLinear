name: Quantity regression tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/regression.test.mjs tests/cad-workflow.test.mjs tests/plan.test.mjs tests/region-editing.test.mjs
